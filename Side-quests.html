<body>
    <canvas id="web-bg" aria-hidden="true"></canvas>

    <header class="header">
        <a href="index.html" class="logo">Cost <span>Millan</span></a>

    <main class="side-quests">
        <h1 class="section-title">Side <span class="gradient-text">Quests</span></h1>
        <p class="quest-intro">
            When I'm not coding, I'm gaming. These are the two worlds I play the most.
        </p>

        <!-- ===================== eFootball ===================== -->
        <section class="game-showcase" id="efootball">
            <div class="game-header">
                <img class="game-logo" src="https://play-lh.googleusercontent.com/jn-jaGEFUPiu0dBP9O6PjiRk-BCwFFLm0RdeOjLH-qLYjhHJlzNBMgl3Sah24htajj67_fdve-DzGsqmMUx1tqQ=s48-rw" alt="eFootball logo">

                    <h2>e<span class="gradient-text">Football</span></h2>
                    <p>WHAT CAN I SAY, IM JUST TOO GOOD </p>
                </div>
            </div>

            <div class="game-gallery">
                <figure class="game-shot">
                    <div class="shot-frame">
                        <img src="eFOOTBAL-suad.jpeg" alt="My eFootball squad">
                    </div>
                    <figcaption><i class="bx bx-group"></i> My Squad</figcaption>
                </figure>

                <figure class="game-shot">
                    <div class="shot-frame">
                        <img src="efootball-rank.jpeg" alt="My highest rank in eFootball">

                    <figcaption><i class="bx bx-trophy"></i> Highest Rank</figcaption>
                </figure>
            </div>
        </section>

        <!-- ===================== PUBG Mobile ===================== -->
        <section class="game-showcase" id="pubg">

                    <h2>PUBG <span class="gradient-text">Mobile</span></h2>
                    <p>here i play the role of a snipper as yall can see i love the big gun</p>
                </div>
            </div>

            <div class="game-gallery">
                <figure class="game-shot">
                    <div class="shot-frame">
                        <img src="pubg-ACCOUNT.jpeg" alt="My PUBG Mobile squad">
                    </div>
                    <figcaption><i class="bx bx-group"></i> My Squad</figcaption>
                </figure>

                <figure class="game-shot">
                    <div class="shot-frame">
                        <img src="PUBG-RANK.jpeg" alt="My highest rank in PUBG Mobile">
                    </div>
                    <figcaption><i class="bx bx-trophy"></i> Highest Rank</figcaption>
                </figure>

        <div class="page-end-btn">
